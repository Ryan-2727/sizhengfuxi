<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大学思政课程复习</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar" id="appHeader" hidden>
    <button class="brand" id="homeBtn" type="button" aria-label="返回首页">
        <span class="brand-mark">思政</span>
      <span>
        <strong>大学思政复习</strong>
        <small>章节梳理 · 题目训练 · 资料索引</small>
      </span>
    </button>
    <div class="top-actions">
      <input id="globalSearch" type="search" placeholder="搜索课程、章节、题目">
      <button id="randomBtn" type="button">随机一题</button>
    </div>
  </header>

  <main>
    <section id="authView" class="auth-view">
      <div class="auth-card">
        <span class="auth-mark">思政</span>
        <h1>大学思政一站式复习平台</h1>
        <p id="authDescription">请输入已开通会员的邮箱，获取登录验证码。</p>
        <form id="requestOtpForm" class="auth-form">
          <label for="emailInput">邮箱</label>
          <input id="emailInput" type="email" autocomplete="email" required placeholder="name@example.com">
          <button type="submit">发送验证码</button>
        </form>
        <form id="verifyOtpForm" class="auth-form" hidden>
          <label for="otpInput">验证码</label>
          <input id="otpInput" inputmode="numeric" autocomplete="one-time-code" required placeholder="请输入邮件中的验证码">
          <button type="submit">验证并进入题库</button>
          <button class="secondary-btn" id="changeEmailBtn" type="button">更换邮箱</button>
        </form>
        <div id="authMessage" class="auth-message" role="status" aria-live="polite"></div>
        <button id="signOutBtn" class="secondary-btn" type="button" hidden>退出登录</button>
      </div>
    </section>

    <section id="homeView" class="home-view" hidden>
      <div class="intro">
        <h1>大学思政一站式复习平台</h1>
        <p>按章节梳理重点，通过刷题、错题复习和大题背诵，提高期末复习效率。</p>
      </div>
      <div id="courseGrid" class="course-grid"></div>
    </section>

    <section id="courseView" class="course-view" hidden>
      <aside class="side-nav">
        <button id="backBtn" class="back-btn" type="button">返回首页</button>
        <h2 id="sideTitle"></h2>
        <nav id="chapterNav" aria-label="课程章节导航"></nav>
      </aside>
      <article class="course-main">
        <section id="courseHero" class="course-hero"></section>
        <section id="chapters" class="panel"></section>
        <section id="keypoints" class="panel"></section>
        <section id="questions" class="panel"></section>
        <section id="sources" class="panel"></section>
      </article>
    </section>
  </main>

  <dialog id="quizDialog">
    <form method="dialog">
      <button class="dialog-close" aria-label="关闭">×</button>
    </form>
    <div id="quizDialogBody"></div>
  </dialog>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
